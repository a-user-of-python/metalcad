name: Build IPA

on:
  workflow_dispatch:
  push:

jobs:
  test:
    name: MetalCADKit tests
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Run kit tests
        working-directory: MetalCADKit
        run: swift test

  build:
    name: Unsigned IPA
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Generate Xcode project
        working-directory: App
        run: python3 gen_project.py
      - name: Build app (unsigned)
        run: |
          xcodebuild -project App/MetalCAD.xcodeproj \
            -scheme MetalCAD \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build/dd \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build
      - name: Package IPA
        run: |
          APP_PATH="build/dd/Build/Products/Release-iphoneos/MetalCAD.app"
          test -d "$APP_PATH"
          rm -rf Payload MetalCAD-unsigned.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qry MetalCAD-unsigned.ipa Payload
          ls -lh MetalCAD-unsigned.ipa
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: MetalCAD-unsigned
          path: MetalCAD-unsigned.ipa
